<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 625 1080" width="625" height="1080" style="background-color: #FFFDF9;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9F2"/>
      <stop offset="50%" stop-color="#FFEEDD"/>
      <stop offset="100%" stop-color="#FFDFD3"/>
    </linearGradient>

    <!-- Vibrant Organic Blob Gradient -->
    <linearGradient id="blobGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9F1C"/>
      <stop offset="100%" stop-color="#FFBF69"/>
    </linearGradient>

    <!-- Accent Secondary Gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2EC4B6"/>
      <stop offset="100%" stop-color="#CBF3F0"/>
    </linearGradient>

    <!-- Paw Print Def -->
    <g id="pawPrint" opacity="0.15">
      <!-- Main Pad -->
      <path d="M 20 25 C 10 25 5 35 10 45 C 15 52 25 52 30 45 C 35 35 30 25 20 25 Z" fill="#333333"/>
      <!-- Toe 1 -->
      <circle cx="8" cy="20" r="4.5" fill="#333333"/>
      <!-- Toe 2 -->
      <circle cx="16" cy="13" r="5" fill="#333333"/>
      <!-- Toe 3 -->
      <circle cx="26" cy="13" r="5" fill="#333333"/>
      <!-- Toe 4 -->
      <circle cx="34" cy="20" r="4.5" fill="#333333"/>
    </g>

    <!-- Bone Def -->
    <g id="bone" opacity="0.2" fill="#FF9F1C">
      <path d="M 15 12 C 12 12 10 9 12 6 C 14 3 18 4 19 8 C 23 6 37 6 41 8 C 42 4 46 3 48 6 C 50 9 48 12 45 12 C 48 12 50 15 48 18 C 46 21 42 20 41 16 C 37 18 23 18 19 16 C 18 20 14 21 12 18 C 10 15 12 12 15 12 Z"/>
    </g>
  </defs>

  <!-- Base Canvas Gradient -->
  <rect width="625" height="1080" fill="url(#bgGradient)"/>

  <!-- Decorative Organic Background Blobs -->
  <path d="M -50 0 Q 200 -50 250 200 T 100 450 T -100 300 Z" fill="url(#accentGradient)" opacity="0.35"/>
  <path d="M 350 1080 Q 200 900 300 700 T 550 550 T 700 800 Z" fill="url(#blobGradient)" opacity="0.25"/>
  <circle cx="520" cy="180" r="140" fill="#2EC4B6" opacity="0.12"/>
  <circle cx="90" cy="850" r="180" fill="#FF9F1C" opacity="0.15"/>

  <!-- Pattern overlay: Paw Prints scattered -->
  <use href="#pawPrint" x="80" y="100" transform="rotate(-15 80 100) scale(1.4)"/>
  <use href="#pawPrint" x="450" y="120" transform="rotate(20 450 120) scale(1.8)"/>
  <use href="#pawPrint" x="280" y="380" transform="rotate(-30 280 380) scale(1.2)"/>
  <use href="#pawPrint" x="50" y="600" transform="rotate(10 50 600) scale(1.6)"/>
  <use href="#pawPrint" x="480" y="820" transform="rotate(-25 480 820) scale(2.0)"/>
  <use href="#pawPrint" x="200" y="960" transform="rotate(15 200 960) scale(1.3)"/>

  <!-- Floating Bone Details -->
  <use href="#bone" x="420" y="320" transform="rotate(35 420 320) scale(1.5)"/>
  <use href="#bone" x="120" y="420" transform="rotate(-40 120 420) scale(1.3)"/>
  <use href="#bone" x="330" y="720" transform="rotate(18 330 720) scale(1.6)"/>

  <!-- Soft Accent Sparkles / Dots -->
  <circle cx="180" cy="220" r="6" fill="#FF9F1C" opacity="0.5"/>
  <circle cx="410" cy="500" r="9" fill="#2EC4B6" opacity="0.5"/>
  <circle cx="520" cy="680" r="5" fill="#FFBF69" opacity="0.6"/>
  <circle cx="150" cy="760" r="8" fill="#2EC4B6" opacity="0.4"/>
</svg>
